<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Library</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="setup" class="setup"><h1>Cozy Library</h1><p>Choose the book packs you want in this world.</p><p class="mod-link"><a href="modding.html">How to Mod / Asset Guide</a></p><div class="pack-options"><label><input type="checkbox" value="starter" checked><strong>Starter Valley</strong><span>Mumbles, mushroom houses, suspicious birds, and drizzle. <a class="pack-link" href="pack.html?id=starter">View assets</a></span></label><label><input type="checkbox" value="tidepool"><strong>Tidepool Almanac</strong><span>Crowned crabs, fog, strange tides, and seaside scholarship. <a class="pack-link" href="pack.html?id=tidepool">View assets</a></span></label></div><div class="shelf-size"><label for="shelf-capacity"><strong>Bookshelf size</strong></label><input id="shelf-capacity" type="number" min="1" max="48" value="12"><span>books</span></div><button id="start">Start Game</button><p id="setup-error"></p></section>
<div id="game" hidden><header><h1>Cozy Library</h1><p id="pack-label"></p><button id="reselect">Reset &amp; Choose Packs</button></header><section class="room"><div class="library"><h2>Your Shelf <span id="progress"></span></h2><div id="shelf" class="shelf"></div></div><div class="window-wrap"><h2>The World Outside</h2><div id="window" class="window"><div id="world" class="world"></div><div class="haze">?</div></div><p id="world-note"></p></div></section><section class="incoming"><h2>Books That Have Found Their Way Here</h2><p>Choose by title. One rejected book will linger; another may vanish for now.</p><div id="offers" class="offers"></div></section></div>
<dialog id="book-dialog"><div id="dialog-content"></div><button id="close-dialog">Close</button></dialog></main><script src="packs/starter.js"></script><script src="packs/tidepool.js"></script><script src="app.js"></script></body></html>
