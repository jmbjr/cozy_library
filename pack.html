<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack Assets · Cozy Library</title><link rel="stylesheet" href="style.css"></head><body><main class="docs"><p><a href="index.html">← Back to Cozy Library</a> · <a href="modding.html">How to Mod</a></p><div id="pack-doc"></div></main><script src="packs/starter.js"></script><script src="packs/tidepool.js"></script><script>
const id=new URLSearchParams(location.search).get("id")||"starter",p=COZY_PACKS[id],root=document.getElementById("pack-doc");
if(!p){root.innerHTML="<h1>Pack not found</h1>"}else{const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));root.innerHTML=`<h1>${esc(p.name)}</h1><p>Pack id: <code>${esc(p.id)}</code> · version ${p.version}</p>
<h2>View</h2><div class="asset-example"><strong>Default View</strong><span>${p.view.width} × ${p.view.height}; haze “${esc(p.view.haze)}”</span></div>
<h2>Bookshelf</h2><div class="asset-example"><strong>Default Bookshelf</strong><span>${p.shelf.columns} columns; ${p.shelf.slotHeight}px slots</span></div>
<h2>Book appearance</h2><div class="asset-example"><strong>Default Book Style</strong><span>Spine <i style="background:${p.bookStyle.spine}"></i> Offer <i style="background:${p.bookStyle.offer}"></i></span></div>
<h2>Books (${p.books.length})</h2><div class="asset-list">${p.books.map(b=>`<div class="asset-example"><strong>${esc(b.title)}</strong><span>${esc(b.text)}</span><code>${esc(b.facts.join(", "))}</code></div>`).join("")}</div>
<h2>World objects</h2><div class="asset-example"><strong>Default World Object mapping</strong><span>${p.worldObjects.length} fact-driven objects in this pack.</span></div><div class="asset-list">${p.worldObjects.map(o=>`<div class="asset-example"><strong>${esc(o.fact)}</strong><span class="asset-preview">${o.content}</span><code>.${esc(o.className)}</code></div>`).join("")}</div>`}</script></body></html>
